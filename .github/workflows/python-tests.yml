---
# Purpose: Python-only tests (ruff, ruff format, mypy, pytest, coverage comment).
# Non-Python lint/security/docs checks run in .github/workflows/lint.yml.
name: Python Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: codecov-automation
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.13t", "3.14", "3.14t"]

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # matrix.python-version carries a trailing "t" for free-threaded builds
      # (e.g. "3.13t"), which mypy's --python-version does not accept and
      # which must never get `jsonpatchx[strict-jsonpath]` installed (its
      # iregexp-check dependency segfaults on import under free-threaded
      # Python). Compute the base version and the strict extra here so later
      # steps do not have to re-derive them.
      - name: Compute base Python version and strict-jsonpath extra
        id: pyver
        shell: bash
        run: |
          PYVER="${{ matrix.python-version }}"
          if [[ "$PYVER" == *t ]]; then
            echo "base=${PYVER%t}" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PYVER" >> "$GITHUB_OUTPUT"
            echo "extra_args=--extra strict-jsonpath" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        env:
          EXTRA_ARGS: ${{ steps.pyver.outputs.extra_args }}
        run: |
          # EXTRA_ARGS is intentionally unquoted: it must word-split into
          # zero or two argv tokens (`--extra strict-jsonpath`), not pass as
          # one quoted string.
          # shellcheck disable=SC2086
          uv sync --frozen --no-default-groups --group ci $EXTRA_ARGS

      - name: Ruff
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        env:
          BASE_PYTHON_VERSION: ${{ steps.pyver.outputs.base }}
        run: uv run mypy --python-version "$BASE_PYTHON_VERSION" .

      - name: Test
        id: test
        run: |
          uv run pytest \
            --cov=jsonpatchx \
            --cov-report=xml:coverage.xml

      # Upload coverage to Codecov whenever tests run (pass or fail).
      # Dependabot PRs skip this upload. Supporting uploads there would require
      # an additional Dependabot-scoped CODECOV_TOKEN secret.
      # Free-threaded legs (3.13t, 3.14t) skip this too: they never install
      # jsonpatchx[strict-jsonpath], but jsonpatchx's own source has no code
      # path gated on that extra, so their jsonpatchx coverage is identical to
      # their non-t sibling's and would only add a duplicate flag.
      - name: Upload coverage to Codecov
        if: |
          !cancelled() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          !endsWith(matrix.python-version, 't') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: py-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # https://github.com/marketplace/actions/alls-green#why
  # For branch protection
  python-check:
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
